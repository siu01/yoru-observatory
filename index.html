<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b1b"><meta name="description" content="夜空を見上げて、今日の気分を星に預ける小さな観測所。">
<title>夜の観測所 — 今日を星にあずける</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f3ff;--muted:#9da3c1;--line:#ffffff20;--gold:#f2d492;--violet:#b6a5ff}*{box-sizing:border-box}body{margin:0;background:#080b1b;color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 80% 25%,#343b7355,transparent 36%),radial-gradient(ellipse at 10% 85%,#29205166,transparent 38%),linear-gradient(155deg,#0c1028,#080b1b 65%)}.grain{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}.wrap{max-width:1120px;margin:auto;padding:30px 6vw 50px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.18em;color:#e9e7f4}.brand b{color:var(--gold);font-weight:400}.date{font:11px 'DM Mono',monospace;letter-spacing:.08em;color:var(--muted)}main{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;min-height:78vh;gap:5vw}.eyebrow{font:11px 'DM Mono',monospace;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}.copy h1{font-size:clamp(46px,7vw,86px);font-weight:300;line-height:1.27;letter-spacing:.08em;margin:24px 0}.copy h1 span{color:var(--gold)}.sub{font-size:14px;line-height:2.2;color:#b2b5cc;letter-spacing:.04em}.prompt{margin-top:48px;color:#d7d8e8;font-size:13px}.moods{display:flex;gap:10px;margin:17px 0 20px;flex-wrap:wrap}.mood{border:1px solid var(--line);background:#ffffff08;color:#bfc2d9;padding:11px 16px;border-radius:30px;font:12px inherit;cursor:pointer;transition:.25s}.mood:hover,.mood.active{border-color:#f2d49299;background:#f2d49214;color:#ffe7ad;transform:translateY(-2px)}.note{font-size:12px;color:var(--muted);min-height:20px}.sky{height:min(62vw,540px);min-height:390px;position:relative;display:grid;place-items:center}.orbit{width:min(100%,480px);aspect-ratio:1;border:1px solid #c6c5f018;border-radius:50%;position:absolute;animation:rotate 100s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #c6c5f014;border-radius:50%;inset:12%}.orbit:after{inset:26%}@keyframes rotate{to{transform:rotate(360deg)}}.moon{width:clamp(150px,24vw,255px);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 33% 30%,#fff7d8,#e9d5a5 33%,#aa9ac2 72%,#5f5f83);box-shadow:0 0 70px #d9c6ff30,0 0 180px #8174d51c;overflow:hidden}.moon:before{content:"";position:absolute;inset:-15%;background:radial-gradient(ellipse at 70% 48%,#a58d9c66 0 6%,transparent 7%),radial-gradient(ellipse at 48% 72%,#8d849b66 0 10%,transparent 11%),radial-gradient(ellipse at 27% 55%,#a0929b66 0 4%,transparent 5%);filter:blur(3px)}.star{position:absolute;color:#eee5c6;font-size:10px;animation:twinkle 3s ease-in-out infinite alternate}.s1{top:14%;left:26%}.s2{top:25%;right:12%;animation-delay:1s}.s3{bottom:20%;left:12%;animation-delay:2s}.s4{bottom:11%;right:27%;font-size:7px}@keyframes twinkle{to{opacity:.25;transform:scale(.7)}}.caption{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:.16em;color:#888eae;white-space:nowrap}.bottom{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;font:10px 'DM Mono',monospace;color:#707792;letter-spacing:.08em}.bottom span:last-child{color:#b8aaf0}@media(max-width:760px){.wrap{padding:25px 7vw}.top{align-items:flex-start}.date{text-align:right}main{display:flex;flex-direction:column;gap:0;padding-top:55px;min-height:auto;align-items:stretch}.copy h1{font-size:52px;margin:18px 0}.sky{order:-1;height:300px;min-height:300px;margin-bottom:20px}.moon{width:165px}.orbit{width:290px}.copy{padding-bottom:45px}.prompt{margin-top:32px}.bottom{gap:15px;line-height:1.8}.caption{bottom:0}}
</style></head>
<body><div class="grain"></div><div class="wrap"><header class="top"><div class="brand">✳ <b>YOZORA</b> OBSERVATORY</div><div class="date" id="date"></div></header><main><section class="copy"><div class="eyebrow">A quiet place for tonight</div><h1>今日を、<br><span>星にあずける。</span></h1><p class="sub">うまくいった日も、そうじゃない日も。<br>夜空を見上げて、気持ちをひとつ置いていこう。</p><div class="prompt">今夜のあなたに近いのは？</div><div class="moods"><button class="mood" data-msg="その光を、ゆっくり育てていこう。">✦ いい日だった</button><button class="mood" data-msg="今日を越えた。それだけで十分。">☾ ちょっと疲れた</button><button class="mood" data-msg="明日の空にも、きっと星はある。">⋆ 明日に期待</button></div><div class="note" id="note" aria-live="polite">選んだ気持ちは、この夜空にそっと届きます。</div></section><section class="sky" aria-label="星空と月のイラスト"><div class="orbit"></div><i class="star s1">✦</i><i class="star s2">✧</i><i class="star s3">✦</i><i class="star s4">✧</i><div class="moon"></div><div class="caption">TONIGHT, THE SKY IS LISTENING</div></section></main><footer class="bottom"><span>夜の観測所 — ひと息つくための場所</span><span>LOOK UP · BREATHE OUT</span></footer></div>
<script>const d=new Date();document.querySelector('#date').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d).toUpperCase();document.querySelectorAll('.mood').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#note').textContent=b.dataset.msg}));</script></body></html>
